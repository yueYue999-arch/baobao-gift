<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff5f8">
  <meta name="description" content="宝宝，给你准备了一点小惊喜。打开看看吧。">
  <title>给宝宝的一份礼物</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E❤️%3C/text%3E%3C/svg%3E">
  <style>
:root {
  color-scheme: light;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  color: #624653;
  background: #fff5f8;
  font-synthesis: none;
  --rose: #b9577b;
  --line: #e9bccd;
  --card-width: clamp(210px, 65vw, 284px);
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; overflow: hidden; overscroll-behavior: none; }
button { font: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid #a34468; outline-offset: 4px; }
[hidden] { display: none !important; }
#scene {
  position: relative;
  width: 100%;
  height: 100%;
  height: 100svh;
  height: 100dvh;
  overflow: hidden;
  background: radial-gradient(ellipse at 16% 14%, #fce6ee 0, transparent 54%),
              radial-gradient(ellipse at 90% 86%, #eaf2f8 0, transparent 50%), #fff7fa;
}
#windows {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 76px);
  left: max(12px, env(safe-area-inset-left, 0px));
}
.invitation, .message-window {
  border: 1px solid #ffffffd9;
  border-radius: 13px;
  overflow: hidden;
  box-shadow: 0 5px 16px #91627716, 0 1px 3px #8056660d;
}
.window-bar {
  display: flex;
  align-items: center;
  gap: 7px;
  min-height: 27px;
  padding: 4px 13px;
  color: #704c5c;
  font-size: 12px;
  line-height: 19px;
  font-weight: 500;
  background: var(--bar, #f6dce6);
}
.window-bar span:first-child { color: #bd6b8d; font-size: 15px; line-height: 18px; }
.invitation {
  position: absolute;
  top: 47%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(340px, calc(100% - 48px));
  background: #fffdfe;
  box-shadow: 0 16px 48px #ac6f891c, 0 2px 8px #ac6f890d;
  border: 1px solid #f2dce5;
  border-radius: 18px;
}
.invitation .window-bar { padding: 7px 14px; background: #fae5ed; }
.invitation-body { padding: 24px 28px 30px; text-align: center; }
.gift-envelope { display: block; width: 108px; height: 86px; margin: 0 auto 18px; }
h1 { margin: 0; font-size: 22px; font-weight: 500; line-height: 1.5; letter-spacing: .04em; }
.choices { margin-top: 26px; }
.choices button {
  width: 100%;
  min-height: 48px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #f8dce7;
  color: #743d53;
  font-size: 15px;
  font-weight: 500;
  box-shadow: 0 3px 0 #edc6d6;
}
.choices button span { margin-left: 5px; color: var(--rose); }
.choices button:active { transform: translateY(2px); box-shadow: 0 1px 0 #edc6d6; }
.message-window {
  position: absolute;
  width: calc(var(--card-width) * var(--width-factor, 1));
  max-width: 100%;
  background: var(--paper);
  transform: rotate(var(--tilt, 0deg));
  animation: arrive 240ms cubic-bezier(.2,.8,.2,1) both;
}
.message-window p {
  margin: 0;
  min-height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 10px 15px;
  color: #624653;
  font-size: clamp(17px, 4.5vw, 19px);
  line-height: 26px;
  font-weight: 500;
  letter-spacing: .025em;
  white-space: nowrap;
}
.message-window.is-older { box-shadow: 0 1px 4px #8056660a; }
.message-window:last-child { box-shadow: 0 7px 22px #80566620, 0 1px 4px #80566614; }
.controls {
  position: absolute;
  z-index: 1000;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  transform: translateX(-50%);
  display: flex;
}
.controls button {
  min-height: 44px;
  min-width: 88px;
  padding: 0 20px;
  font-size: 13px;
  color: #7b5969;
  background: #ffffffdc;
  border: 1px solid #eddae2;
  border-radius: 24px;
  white-space: nowrap;
}
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.no-script { position: absolute; bottom: 20px; width: 100%; text-align: center; font-size: 14px; }
@keyframes arrive {
  from { opacity: 0; transform: translateY(8px) rotate(var(--tilt, 0deg)) scale(.97); }
  to { opacity: 1; transform: translateY(0) rotate(var(--tilt, 0deg)) scale(1); }
}
@media (min-width: 768px) {
  #windows {
    top: calc(env(safe-area-inset-top, 0px) + 28px);
    right: max(24px, env(safe-area-inset-right, 0px));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 88px);
    left: max(24px, env(safe-area-inset-left, 0px));
  }
}
@media (max-height: 440px) and (orientation: landscape) {
  .invitation { top: 50%; }
  .invitation-body { padding: 12px 24px 20px; }
  .gift-envelope { width: 60px; height: 48px; margin-bottom: 4px; }
  .choices { margin-top: 12px; }
  #windows { top: max(12px, env(safe-area-inset-top, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); }
  .message-window p { min-height: 40px; padding: 6px 8px 9px; font-size: 16px; }
  .controls { bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); }
}
@media (prefers-reduced-motion: reduce) {
  .message-window { animation: none; }
  .choices button:active { transform: none; }
}

</style>
</head>
<body>
  <main id="scene" aria-label="给宝宝的祝福礼物">
    <div id="windows" role="list" aria-label="送给你的悄悄话"></div>
    <section id="invitation" class="invitation" aria-labelledby="question">
      <div class="window-bar"><span aria-hidden="true">♥</span><span>宝宝</span></div>
      <div class="invitation-body">
        <svg class="gift-envelope" viewBox="0 0 100 80" fill="none" aria-hidden="true">
          <rect x="13" y="24" width="74" height="48" rx="7" fill="#f5c8d8"/>
          <path d="M15 28 50 7l35 21" fill="#edb5ca"/>
          <rect x="24" y="12" width="52" height="47" rx="5" fill="#fffdfc"/>
          <path d="M50 39c-3-3-12-8-12-14 0-7 9-8 12-2 3-6 12-5 12 2 0 6-9 11-12 14Z" fill="#d97598"/>
          <path d="m14 29 36 25 36-25v35a7 7 0 0 1-7 7H21a7 7 0 0 1-7-7Z" fill="#f6d6e1"/>
          <path d="m16 68 26-22m42 22L58 46" stroke="#edb8cc" stroke-width="1.4"/>
        </svg>
        <h1 id="question">是否接受礼物？</h1>
        <div class="choices">
          <button id="accept" class="primary" type="button">接受礼物 <span aria-hidden="true">♥</span></button>
        </div>
      </div>
    </section>
    <nav id="controls" class="controls" aria-label="播放控制" hidden>
      <button id="pause" type="button" aria-label="暂停弹窗" title="暂停 / 继续">暂停</button>
      <button id="replay" type="button" aria-label="重新打开礼物" hidden>再看一遍 ♥</button>
    </nav>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
    <noscript><p class="no-script">请开启浏览器的 JavaScript，即可打开这份礼物。</p></noscript>
  </main>
<script>
window.GIFT_MESSAGES = Object.freeze([
  "要顺顺利利呀",
  "烦恼通通跑掉",
  "乖乖早点睡哦",
  "记得多喝温水",
  "不许偷偷熬夜",
  "要开开心心哒",
  "不许太累啦宝贝",
  "好好吃饭好不好",
  "天冷要添衣服",
  "出门要注意安全",
  "累了就跟我说",
  "不许硬撑着哦",
  "今天也要好运",
  "万事都如你愿",
  "要照顾好自己",
  "少一点压力嘛",

  "走路慢一点点",
  "好好保护自己",
  "不要生闷气啦",
  "情绪要甜甜的",
  "不用慌不用急",
  "日子温柔待你",
  "所有收获都甜",
  "好运偏爱我的宝",
  "焦虑全部退散",
  "有空就歇一会",
  "多伸伸懒腰哦",
  "爱惜你的身体",
  "肩膀别绷太紧",
  "眼里一直有光",
  "心愿都会实现",
  "一路都是坦途",
  "事事稳稳当当",
  "少点奔波劳累",
  "留点清闲给自己",
  "晚风轻轻陪你",
  "安心乖乖睡觉",
  "一觉睡到天亮",
  "醒来全是欢喜",
  "四季平安安康",
  "保持你的热爱",
  "难关都会跨过",
  "好运如约而至",
  "别委屈自己啦",
  "我会一直陪你",
  "不用事事逞强",
  "难过就告诉我",
  "清风一直伴你",
  "暖阳跟随着你",
  "诸事都安安稳稳",
  "常常保持微笑",
  "前路没有烦忧",
  "身心舒舒服服",
  "永远被我偏爱",
  "不许忽略自己",
  "疲惫少一点点",
  "福气常常来找你",
  "万事皆可期待",
  "想扑进你怀里",
  "有我在别害怕",
  "今天也要元气",
  "难题自动躲开",
  "贵人一直相伴",
  "心情要暖洋洋",
  "好好放松一下",
  "少碰生冷食物",
  "记得慢慢喝水",
  "劳逸结合哦宝",
  "黑夜也有温柔",
  "好梦环绕着你",
  "年年都有欢喜",
  "平安常伴左右",
  "自在舒心就好",
  "所得皆是美好",
  "脚步从容一点",
  "烦心事快走开",
  "每天甜甜蜜蜜",
  "好好爱惜自己",
  "见面要抱抱你",
  "想念藏在心底",
  "愿你轻松自在",
  "所有坎坷抚平",
  "喜乐常驻心间",
  "顺风顺水无忧",
  "累了就停下来",
  "好好善待自己",
  "好运源源不断",
  "岁岁平安顺遂",
  "保持满满活力",
  "烦恼不许靠近",
  "一切慢慢变好",
  "愿你事事稳妥",
  "我永远向着你",
  "疲惫统统消散",
  "每天都有小惊喜",
  "安心做你自己",
  "温柔永远予你",
  "我超超级爱你",
]);

(() => {
  "use strict";
  const windows = document.querySelector("#windows");
  const invitation = document.querySelector("#invitation");
  const controls = document.querySelector("#controls");
  const pauseButton = document.querySelector("#pause");
  const replayButton = document.querySelector("#replay");
  const status = document.querySelector("#status");
  const MESSAGE_INTERVAL_MS = 1000 / 6;
  const colors = [
    ["#f6dce6", "#fff5f8"],
    ["#deedf5", "#f3faff"],
    ["#f3e9c8", "#fffcef"],
    ["#e0efdf", "#f4faf2"],
    ["#ece1f2", "#fbf6ff"],
    ["#f6e1d3", "#fff6ee"]
  ];
  const messages = window.GIFT_MESSAGES;
  let cards = [];
  let frame = 0;
  let elapsed = 0;
  let previousTime = null;
  let paused = false;
  let playing = false;

  function position(card, index) {
    const scatter = (seed) => {
      const value = Math.sin((index + 1) * seed) * 43758.5453;
      return value - Math.floor(value);
    };
    const centered = index === 0 || index === messages.length - 1;
    const angle = centered ? 0 : (scatter(39.425) - .5) * 12;
    card.style.setProperty("--tilt", `${angle}deg`);
    card.style.setProperty("--width-factor", String(.92 + scatter(8.317) * .18));
    const width = card.offsetWidth;
    const height = card.offsetHeight;
    // Reserve the rotated corners so even narrow phones keep every new note in view.
    const radians = Math.abs(angle) * Math.PI / 180;
    const insetX = Math.max(0, (width * Math.cos(radians) + height * Math.sin(radians) - width) / 2);
    const insetY = Math.max(0, (height * Math.cos(radians) + width * Math.sin(radians) - height) / 2);
    const roomX = Math.max(0, windows.clientWidth - width - insetX * 2);
    const roomY = Math.max(0, windows.clientHeight - height - insetY * 2 - 8);
    // A scattered sequence fills the phone without falling into neat repeating rows.
    const x = centered ? .5 : scatter(12.9898);
    const y = centered ? .46 : (index * .618034 + scatter(78.233) * .24) % 1;
    card.style.left = `${insetX + x * roomX}px`;
    card.style.top = `${insetY + y * roomY}px`;
  }

  function addMessage(index) {
    const card = document.createElement("article");
    card.className = "message-window";
    card.setAttribute("role", "listitem");
    const palette = colors[(index * 5 + Math.floor(index / 6)) % colors.length];
    card.style.setProperty("--bar", palette[0]);
    card.style.setProperty("--paper", palette[1]);
    card.style.zIndex = String(index + 1);
    const bar = document.createElement("div");
    bar.className = "window-bar";
    const heart = document.createElement("span");
    heart.textContent = "♥";
    heart.setAttribute("aria-hidden", "true");
    const title = document.createElement("span");
    title.textContent = "宝宝";
    bar.append(heart, title);
    const text = document.createElement("p");
    text.textContent = messages[index];
    card.append(bar, text);
    windows.append(card);
    cards.push(card);
    if (cards.length > 12) cards[cards.length - 13].classList.add("is-older");
    position(card, index);
  }

  function tick(time) {
    if (!playing || paused || document.hidden) return;
    if (previousTime !== null) elapsed += time - previousTime;
    previousTime = time;
    // Keep six notes per second; skip accumulated intervals after a long stall.
    if (cards.length < messages.length && (cards.length === 0 || elapsed >= MESSAGE_INTERVAL_MS)) {
      addMessage(cards.length);
      elapsed = elapsed >= MESSAGE_INTERVAL_MS * 2 ? 0 : elapsed % MESSAGE_INTERVAL_MS;
    }
    if (cards.length === messages.length) {
      playing = false;
      pauseButton.hidden = true;
      replayButton.hidden = false;
      replayButton.focus({ preventScroll: true });
      status.textContent = `${messages.length} 句悄悄话都送给你啦。`;
      return;
    }
    frame = requestAnimationFrame(tick);
  }

  function start() {
    cancelAnimationFrame(frame);
    windows.replaceChildren();
    cards = [];
    elapsed = 0;
    previousTime = null;
    paused = false;
    playing = true;
    invitation.hidden = true;
    controls.hidden = false;
    pauseButton.hidden = false;
    replayButton.hidden = true;
    pauseButton.textContent = "暂停";
    pauseButton.setAttribute("aria-label", "暂停弹窗");
    pauseButton.focus({ preventScroll: true });
    status.textContent = "礼物打开啦。";
    frame = requestAnimationFrame(tick);
  }

  document.querySelector("#accept").addEventListener("click", start);
  replayButton.addEventListener("click", start);
  pauseButton.addEventListener("click", () => {
    paused = !paused;
    pauseButton.textContent = paused ? "继续" : "暂停";
    pauseButton.setAttribute("aria-label", paused ? "继续弹窗" : "暂停弹窗");
    cancelAnimationFrame(frame);
    previousTime = null;
    if (!paused) frame = requestAnimationFrame(tick);
    status.textContent = paused ? "已暂停。" : "继续为你送上悄悄话。";
  });
  document.addEventListener("visibilitychange", () => {
    cancelAnimationFrame(frame);
    previousTime = null;
    if (!document.hidden && playing && !paused) frame = requestAnimationFrame(tick);
  });
  // React to the usable area itself, including browser bars and changing safe insets.
  new ResizeObserver(() => cards.forEach(position)).observe(windows);
})();

</script>
</body>
</html>
